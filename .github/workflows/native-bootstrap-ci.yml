name: Native checkpoint bootstrap CI

on:
  push:
    branches:
      - codex/native-1.0
    paths:
      - '.github/workflows/native-bootstrap-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/native-bootstrap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Download and validate public native source checkpoint
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'native-source.tar.xz'
          $uri = 'https://drive.google.com/uc?export=download&id=1FXTLAFNRNAimAO3n9xQqAo-xFeEc-Jrl'
          curl.exe --fail --location --silent --show-error $uri --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download source checkpoint.' }
          $expected = '1188cb44ae6d5d19bf7e4214ef42b8f5bf8f87426c64dc2669b734c728eaf70c'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source checkpoint SHA-256 mismatch: $actual" }
          $target = Join-Path $env:RUNNER_TEMP 'native-source-root'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          tar -xJf $archive -C $target
          $source = Join-Path $target 'codex-usage-monitor'
          if (-not (Test-Path (Join-Path $source 'CodexUsageMonitor.slnx'))) { throw 'Extracted source root is invalid.' }
          "NATIVE_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ env.NATIVE_SOURCE }}\global.json

      - name: Verify static repository boundaries
        working-directory: ${{ env.NATIVE_SOURCE }}
        shell: pwsh
        run: python eng/verify-static.py

      - name: Restore
        working-directory: ${{ env.NATIVE_SOURCE }}
        shell: pwsh
        run: dotnet restore CodexUsageMonitor.slnx --nologo

      - name: Build
        working-directory: ${{ env.NATIVE_SOURCE }}
        shell: pwsh
        run: dotnet build CodexUsageMonitor.slnx -c Debug --no-restore --nologo

      - name: Test
        working-directory: ${{ env.NATIVE_SOURCE }}
        shell: pwsh
        run: dotnet test CodexUsageMonitor.slnx -c Debug --no-build --nologo --logger "trx;LogFileName=bootstrap.trx" --results-directory ${{ runner.temp }}\test-results

      - name: Verify formatting and analyzers
        working-directory: ${{ env.NATIVE_SOURCE }}
        shell: pwsh
        run: dotnet format CodexUsageMonitor.slnx --verify-no-changes --no-restore

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-bootstrap-diagnostics
          path: |
            ${{ runner.temp }}\test-results
          if-no-files-found: ignore
          retention-days: 7
