name: Native checkpoint bootstrap CI

on:
  push:
    branches:
      - codex/native-1.0
    paths:
      - '.bootstrap/native/**'
      - '.github/workflows/native-bootstrap-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/native/**'
      - '.github/workflows/native-bootstrap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Reconstruct and validate native source checkpoint
        shell: pwsh
        run: |
          @'
          from __future__ import annotations
          import base64, hashlib, pathlib, tarfile
          root = pathlib.Path.cwd()
          names = ['part000.txt', 'part001.txt', 'part002.txt']
          parts = [root / '.bootstrap' / 'native' / name for name in names]
          missing = [p.name for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f'Missing bootstrap parts: {missing}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          archive = base64.b64decode(encoded, validate=True)
          expected = '2f2430ff811578553fc8564364b541d7dd0559403f6631ce5f98a79eadddda08'
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f'Bootstrap archive SHA-256 mismatch: {actual}')
          archive_path = pathlib.Path(r'${{ runner.temp }}') / 'native-checkpoint.tar.xz'
          archive_path.write_bytes(archive)
          target = pathlib.Path(r'${{ runner.temp }}') / 'native-source'
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, 'r:xz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'Unsafe archive entry: {member.name}')
              bundle.extractall(target, members=members, filter='data')
          print(f'Extracted {len(members)} entries to {target}')
          '@ | python -

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ runner.temp }}\native-source\global.json

      - name: Verify static repository boundaries
        working-directory: ${{ runner.temp }}\native-source
        shell: pwsh
        run: python eng/verify-static.py

      - name: Restore
        working-directory: ${{ runner.temp }}\native-source
        shell: pwsh
        run: dotnet restore CodexUsageMonitor.slnx --nologo

      - name: Build
        working-directory: ${{ runner.temp }}\native-source
        shell: pwsh
        run: dotnet build CodexUsageMonitor.slnx -c Debug --no-restore --nologo

      - name: Test
        working-directory: ${{ runner.temp }}\native-source
        shell: pwsh
        run: dotnet test CodexUsageMonitor.slnx -c Debug --no-build --nologo --logger "trx;LogFileName=bootstrap.trx" --results-directory ${{ runner.temp }}\test-results

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-bootstrap-diagnostics
          path: |
            ${{ runner.temp }}\test-results
          if-no-files-found: ignore
          retention-days: 7
