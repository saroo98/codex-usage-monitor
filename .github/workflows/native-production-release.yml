name: Native production release staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact centralized product version
        required: true
        default: 6.0.0
      feed_base_uri:
        description: HTTPS base URI for update artifacts and App Installer metadata
        required: true
      release_notes_uri:
        description: HTTPS release notes URI embedded in the update manifest
        required: true
      identity_name:
        description: MSIX package identity name
        required: true
        default: saroo98.CodexUsageMonitor
      publisher:
        description: Exact MSIX publisher matching the signing certificate subject
        required: true

permissions:
  contents: read

concurrency:
  group: native-production-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  stage:
    name: Build signed production artifact set
    runs-on: windows-2022
    timeout-minutes: 120
    environment: native-production-release

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Materialize protected signing inputs
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_BASE64)) {
            throw 'Protected signing inputs are unavailable.'
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'native-release-signing.pfx'
          $updateKey = Join-Path $env:RUNNER_TEMP 'native-update-ed25519.key'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          [IO.File]::WriteAllBytes($updateKey, [Convert]::FromBase64String($env:UPDATE_PRIVATE_KEY_BASE64))
          "certificate=$certificate" >> $env:GITHUB_OUTPUT
          "update_key=$updateKey" >> $env:GITHUB_OUTPUT

      - name: Build and verify signed production artifacts
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          UPDATE_TRUST_ANCHOR: ${{ secrets.UPDATE_TRUST_ANCHOR }}
          SIGNING_TIMESTAMP_URL: ${{ secrets.SIGNING_TIMESTAMP_URL }}
          PUBLISHER_THUMBPRINTS: ${{ secrets.PUBLISHER_THUMBPRINTS }}
          RELEASE_VERSION: ${{ inputs.version }}
          FEED_BASE_URI: ${{ inputs.feed_base_uri }}
          RELEASE_NOTES_URI: ${{ inputs.release_notes_uri }}
          IDENTITY_NAME: ${{ inputs.identity_name }}
          PACKAGE_PUBLISHER: ${{ inputs.publisher }}
          SIGNING_CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate }}
          UPDATE_PRIVATE_KEY_PATH: ${{ steps.signing.outputs.update_key }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_TENANT: ${{ vars.MICROSOFT_OAUTH_TENANT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $thumbprints = @($env:PUBLISHER_THUMBPRINTS -split ',' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          ./eng/package-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputRoot artifacts/production-release `
            -Configuration Release `
            -IdentityName $env:IDENTITY_NAME `
            -Publisher $env:PACKAGE_PUBLISHER `
            -SigningCertificatePath $env:SIGNING_CERTIFICATE_PATH `
            -SigningCertificatePassword $password `
            -TimestampUrl $env:SIGNING_TIMESTAMP_URL `
            -UpdatePrivateKeyPath $env:UPDATE_PRIVATE_KEY_PATH `
            -UpdateTrustAnchor $env:UPDATE_TRUST_ANCHOR `
            -FeedBaseUri $env:FEED_BASE_URI `
            -ReleaseNotesUri $env:RELEASE_NOTES_URI `
            -PublisherThumbprints $thumbprints `
            -GoogleOAuthClientId $env:GOOGLE_OAUTH_CLIENT_ID `
            -MicrosoftOAuthClientId $env:MICROSOFT_OAUTH_CLIENT_ID `
            -MicrosoftOAuthTenant $env:MICROSOFT_OAUTH_TENANT `
            -Production

      - name: Remove materialized signing inputs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '${{ steps.signing.outputs.certificate }}' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '${{ steps.signing.outputs.update_key }}' -Force -ErrorAction SilentlyContinue

      - name: Upload signed staging artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-production-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/production-release/**
          if-no-files-found: error
          retention-days: 30
