name: Native full validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-full-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  validate:
    name: Release x64 and Arm64 validation
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install exact Python 3.13.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Verify exact Python version
        shell: pwsh
        run: |
          if ((python --version) -ne 'Python 3.13.14') {
            throw 'Expected Python 3.13.14.'
          }

      - name: Capture verification evidence
        shell: pwsh
        run: ./eng/capture-verification-evidence.ps1 -Configuration Release -Architecture All -SkipUi

      - name: Build and independently verify unsigned release candidate
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_TENANT: ${{ vars.MICROSOFT_OAUTH_TENANT }}
        run: |
          . ./eng/ProductVersion.ps1
          $version = Get-ProductVersion
          ./eng/package-release.ps1 -Version $version -OutputRoot artifacts/release-candidate -Configuration Release `
            -GoogleOAuthClientId $env:GOOGLE_OAUTH_CLIENT_ID `
            -MicrosoftOAuthClientId $env:MICROSOFT_OAUTH_CLIENT_ID `
            -MicrosoftOAuthTenant $env:MICROSOFT_OAUTH_TENANT

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-full-verification-${{ github.sha }}
          path: |
            artifacts/TestResults/**
            artifacts/verification/**
            artifacts/release-candidate/**
          if-no-files-found: error
          retention-days: 30
