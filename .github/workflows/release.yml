name: Build portable release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "tools/package.py"
      - "dist/SHA256SUMS.txt"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Preserve committed checksum
        shell: pwsh
        run: Copy-Item dist/SHA256SUMS.txt "$env:RUNNER_TEMP\expected-SHA256SUMS.txt"

      - name: Run tests
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tools
          python -m unittest discover -s app/tests -v

      - name: Build deterministic portable ZIP
        run: python tools/package.py

      - name: Verify committed and generated checksums
        shell: pwsh
        run: |
          $expected = (Get-Content "$env:RUNNER_TEMP\expected-SHA256SUMS.txt" -Raw).Trim()
          $generated = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          if ($expected -ne $generated) { throw "Generated package does not match the committed checksum." }
          $parts = $generated -split "\s+\*", 2
          if ($parts.Count -ne 2) { throw "Invalid checksum format." }
          $actual = (Get-FileHash (Join-Path dist $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Checksum verification failed." }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release package
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Select release target
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content app/VERSION -Raw).Trim()
          if (-not $version) { throw "app/VERSION is empty." }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $publish = "true"
          } else {
            $tag = "v$version"
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
            $releaseExists = $LASTEXITCODE -eq 0
            $publish = if ((Test-Path dist/RELEASED.md) -and $releaseExists) { "false" } else { "true" }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Usage Notifier ${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "release-verify"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Usage-Monitor-for-Codex-*-Windows.zip" --pattern "SHA256SUMS.txt" --dir $verifyDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to download published release assets." }

          $line = (Get-Content (Join-Path $verifyDir "SHA256SUMS.txt") -Raw).Trim()
          $parts = $line -split "\s+\*", 2
          if ($parts.Count -ne 2) { throw "Published checksum file is invalid." }
          $asset = Join-Path $verifyDir $parts[1]
          if (-not (Test-Path $asset)) { throw "Published release ZIP is missing." }
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Published release checksum verification failed." }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url | ConvertFrom-Json
          $marker = @"
          # Published release

          - Release: [$env:RELEASE_TAG]($($release.url))
          - Package: `$($parts[1])`
          - SHA-256: `$actual`
          - Verification: downloaded from GitHub Releases and hashed successfully by the public release workflow
          "@
          Set-Content -Path dist/RELEASED.md -Value $marker -Encoding utf8

      - name: Record verified release
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/RELEASED.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record verified public release"
            git push
          }
