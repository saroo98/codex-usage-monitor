name: Build portable release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "tools/package.py"
      - "dist/SHA256SUMS.txt"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Preserve committed checksum
        shell: pwsh
        run: Copy-Item dist/SHA256SUMS.txt "$env:RUNNER_TEMP\expected-SHA256SUMS.txt"

      - name: Run tests
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tools
          python -m unittest discover -s app/tests -v

      - name: Build deterministic portable ZIP
        run: python tools/package.py

      - name: Verify committed and generated checksums
        shell: pwsh
        run: |
          $expected = (Get-Content "$env:RUNNER_TEMP\expected-SHA256SUMS.txt" -Raw).Trim()
          $generated = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          if ($expected -ne $generated) { throw "Generated package does not match the committed checksum." }
          $parts = $generated -split "\s+\*", 2
          if ($parts.Count -ne 2) { throw "Invalid checksum format." }
          $actual = (Get-FileHash (Join-Path dist $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Checksum verification failed." }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release package
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Select release target
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $publish = "true"
          } else {
            $tag = "v5.0.0"
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
            $publish = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Usage Notifier 5.0.0
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
