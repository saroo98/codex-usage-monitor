# Public release pipeline for the current application and verified backup.
name: Build portable release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "tools/package.py"
      - "dist/SHA256SUMS.txt"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Preserve committed checksum
        shell: pwsh
        run: Copy-Item dist/SHA256SUMS.txt "$env:RUNNER_TEMP\expected-SHA256SUMS.txt"

      - name: Run tests
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tools
          python -m unittest discover -s app/tests -v

      - name: Build deterministic portable ZIPs
        run: python tools/package.py

      - name: Verify committed and generated checksums
        shell: pwsh
        run: |
          $expected = (Get-Content "$env:RUNNER_TEMP\expected-SHA256SUMS.txt" -Raw).Trim()
          $generated = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          if ($expected -ne $generated) { throw "Generated packages do not match the committed checksums." }
          $entries = @()
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-fA-F]{64}) \*(.+)$') { throw "Invalid checksum line: $line" }
            $path = Join-Path dist $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing package: $($Matches[2])" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "Checksum verification failed: $($Matches[2])" }
            $entries += [pscustomobject]@{ Name = $Matches[2]; Hash = $actual; Size = (Get-Item $path).Length }
          }
          if ($entries.Count -ne 2) { throw "Expected a primary and backup ZIP." }
          if ($entries[0].Hash -ne $entries[1].Hash -or $entries[0].Size -ne $entries[1].Size) { throw "Backup ZIP does not match the primary ZIP." }

      - name: Create or update GitHub release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content app/VERSION -Raw).Trim()
          if (-not $version) { throw "app/VERSION is empty." }
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag dist/*.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Codex Usage Notifier $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "release-verify"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Usage-Monitor-for-Codex-*.zip" --pattern "SHA256SUMS.txt" --dir $verifyDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to download published release assets." }

          $entries = @()
          foreach ($line in Get-Content (Join-Path $verifyDir "SHA256SUMS.txt")) {
            if ($line -notmatch '^([0-9a-fA-F]{64}) \*(.+)$') { throw "Published checksum line is invalid: $line" }
            $asset = Join-Path $verifyDir $Matches[2]
            if (-not (Test-Path $asset)) { throw "Published release ZIP is missing: $($Matches[2])" }
            $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "Published release checksum failed: $($Matches[2])" }
            $entries += [pscustomobject]@{ Name = $Matches[2]; Hash = $actual; Size = (Get-Item $asset).Length }
          }
          if ($entries.Count -ne 2) { throw "Expected two published ZIP archives." }
          if ($entries[0].Hash -ne $entries[1].Hash -or $entries[0].Size -ne $entries[1].Size) { throw "Published backup ZIP is not identical to the primary ZIP." }

          $releaseUrl = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url --jq .url
          $marker = @(
            "# Published release",
            "",
            "- Release: [$env:RELEASE_TAG]($releaseUrl)",
            "- Primary package: ``$($entries[0].Name)``",
            "- Backup package: ``$($entries[1].Name)``",
            "- Size: ``$($entries[0].Size) bytes`` each",
            "- SHA-256: ``$($entries[0].Hash)``",
            "- Verification: both archives downloaded from GitHub Releases, reopened, integrity-tested, and confirmed byte-for-byte identical"
          ) -join "`n"
          Set-Content -Path dist/RELEASED.md -Value $marker -Encoding utf8

      - name: Record verified release
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/RELEASED.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record verified public release"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release packages
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
