name: Bootstrap public application source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Decode source archive
        shell: pwsh
        run: |
          $chunks = Get-ChildItem bootstrap/*.b64 | Sort-Object Name
          if ($chunks.Count -ne 13) { throw "Expected 13 source chunks." }
          $encoded = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\source.zip", [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash "$env:RUNNER_TEMP\source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "1ea31d559ec139260f65f58fe68ba278706e5297442604f2ec24bcf5c502fd16") { throw "Source archive checksum mismatch." }

      - name: Extract public source
        shell: pwsh
        run: |
          Remove-Item app -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$env:RUNNER_TEMP\source.zip" "$env:RUNNER_TEMP\source" -Force
          Copy-Item "$env:RUNNER_TEMP\source\CodexUsageNotifier" app -Recurse -Force

      - name: Commit public source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if (-not (git diff --cached --quiet)) {
            git commit -m "Add current public application source and tests"
            git push
          }
