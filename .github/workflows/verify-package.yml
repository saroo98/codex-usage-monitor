name: Verify portable package

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/package.py"
      - "LICENSE"
      - ".github/workflows/verify-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run public tests
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tools
          python -m unittest discover -s app/tests -v

      - name: Build and inspect package
        shell: pwsh
        run: |
          python tools/package.py
          $line = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          $parts = $line -split "\s+\*", 2
          if ($parts.Count -ne 2) { throw "Invalid checksum format." }
          $package = Join-Path dist $parts[1]
          $actual = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Package checksum verification failed." }
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); assert bad is None, bad; print(f'ZIP entries: {len(z.infolist())}')" $package
          $record = @(
            "# Build verification",
            "",
            "- Package: ``$($parts[1])``",
            "- SHA-256: ``$actual``",
            "- Tests: passed on the public Windows build runner",
            "- ZIP integrity: passed"
          ) -join "`n"
          Set-Content dist/BUILD-VERIFICATION.md -Value $record -Encoding utf8

      - name: Record verified checksum
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SHA256SUMS.txt dist/BUILD-VERIFICATION.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record verified package checksum"
            git pull --rebase origin main
            git push origin HEAD:main
          }
