name: Verify portable package

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/package.py"
      - "LICENSE"
      - ".github/workflows/verify-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run public tests
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tools
          python -m unittest discover -s app/tests -v

      - name: Build and inspect package
        shell: pwsh
        run: |
          python tools/package.py
          $entries = @()
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-fA-F]{64}) \*(.+)$') { throw "Invalid checksum line: $line" }
            $path = Join-Path dist $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing package: $($Matches[2])" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "Package checksum verification failed: $($Matches[2])" }
            python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); assert bad is None, bad; print(f'ZIP entries: {len(z.infolist())}')" $path
            $entries += [pscustomobject]@{ Name = $Matches[2]; Hash = $actual; Size = (Get-Item $path).Length }
          }
          if ($entries.Count -ne 2) { throw "Expected a primary and backup ZIP." }
          if ($entries[0].Hash -ne $entries[1].Hash) { throw "Backup ZIP does not match the primary ZIP." }
          if ($entries[0].Size -ne $entries[1].Size) { throw "Backup ZIP size does not match the primary ZIP." }

          $record = @(
            "# Build verification",
            "",
            "- Primary package: ``$($entries[0].Name)``",
            "- Backup package: ``$($entries[1].Name)``",
            "- Size: ``$($entries[0].Size) bytes`` each",
            "- SHA-256: ``$($entries[0].Hash)``",
            "- Tests: passed on the public Windows build runner",
            "- ZIP integrity: passed for both archives",
            "- Backup equality: byte-for-byte match"
          ) -join "`n"
          Set-Content dist/BUILD-VERIFICATION.md -Value $record -Encoding utf8

      - name: Record verified checksum
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SHA256SUMS.txt dist/BUILD-VERIFICATION.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record verified package checksum"
            git pull --rebase origin main
            git push origin HEAD:main
          }
