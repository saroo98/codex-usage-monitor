name: Validate GitHub Pages source

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public website
    runs-on: windows-2022
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Python 3.13.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Verify exact Python version
        shell: pwsh
        run: |
          if ((python --version) -ne 'Python 3.13.14') {
            throw 'Expected Python 3.13.14.'
          }

      - name: Verify public website
        run: |
          python eng/audit-publication.py
          python eng/verify-site.py
