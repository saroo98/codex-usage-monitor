name: Validate GitHub Pages source

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public website
    runs-on: windows-2022
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install exact Python 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'

      - name: Verify exact Python version
        shell: pwsh
        run: |
          if ((python --version) -ne 'Python 3.13.14') {
            throw 'Expected Python 3.13.14.'
          }

      - name: Verify public website
        run: |
          python eng/audit-publication.py
          python eng/verify-site.py
