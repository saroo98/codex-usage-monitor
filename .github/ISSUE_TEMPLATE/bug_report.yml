name: Bug report
description: Report a reproducible problem in an official release
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, cookies, full account identifiers, prompt content, private repository paths, or unredacted logs. Security vulnerabilities must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Portable x64
        - Portable Arm64
        - MSIX x64
        - MSIX Arm64
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex version
      placeholder: Output of codex --version
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only diagnostics produced by the application's redacted export. Remove anything sensitive before submitting.
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, personal data, private paths, prompt content, and unredacted logs.
          required: true
        - label: I checked the latest release and searched existing issues.
          required: true
